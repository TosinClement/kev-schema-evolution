# Dependency lock for the KEV schema-evolution pipeline.
#
# Fully pinned, including transitive dependencies. Install with:
#     python -m venv venv
#     venv/bin/pip install -r requirements.lock
#
# Validated against Python 3.11.15 on Linux (x86_64).
#
# Why pinned: matplotlib's tight-bbox rounding changes between minor versions.
# An unpinned build produced figures differing by one pixel in width between
# matplotlib 3.10.9 and 3.11.1, which broke byte-level reproducibility of the
# figures even though every data table was identical. See docs/VERIFY_CHECKLIST.md
# Section A, defect A1.
#
# Direct dependencies: matplotlib, jsonschema, PyYAML. Everything else is
# resolved from those.

